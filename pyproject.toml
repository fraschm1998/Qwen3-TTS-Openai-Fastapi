[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts"
# Local-version suffix (PEP 440): this fork tracks upstream qwen-tts 0.1.1's
# API surface, which lets faster-qwen3-tts's `qwen-tts>=0.1.1` requirement
# resolve against this in-tree package instead of pulling (and clobbering it
# with) the PyPI distribution of the same name. When bumping the
# faster-qwen3-tts pin, re-verify the qwen_tts internals it touches still
# exist here (see api/backends/faster_qwen3_tts.py).
version = "0.1.1+fieri"
description = "Qwen-TTS python package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "gradio",
  "librosa",
  "torchaudio",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart",
  "pydantic>=2.0.0",
  "inflect",
  "aiofiles",
  "pydub",
  "httpx>=0.24.0",
]
vllm = [
  "vllm>=0.4.0",
]
# CUDA-graph accelerated backend (TTS_BACKEND=faster). GPU-only.
# Requires Python 3.10+ and torch>=2.5.1 (CUDA graph capture is
# unreliable on older torch). Its qwen-tts>=0.1.1 dependency is
# satisfied by this package itself — see the version comment above.
faster = [
  "faster-qwen3-tts>=0.3.0,<0.4",
]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/Qwen/Qwen3-TTS"
Repository = "https://github.com/Qwen/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"
qwen-tts-api = "api.main:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*", "api*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]
api = ["static/*", "static/**/*"]